<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11130f">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/images/OpenVolumetric_logo/openvolimetric_logo_social_media.png' | absolute_url }}">
    <meta property="og:image:width" content="1254">
    <meta property="og:image:height" content="1254">
    <meta property="og:image:alt" content="OpenVolumetric">
    <meta name="twitter:card" content="summary_large_image">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="icon" href="{{ '/assets/images/OpenVolumetric_logo/openvolimetric_logo_social_media.png' | relative_url }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ '/assets/images/OpenVolumetric_logo/openvolimetric_logo_social_media.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% if page.coming_soon %}
    <main id="main">{% include coming-soon.html %}</main>
    {% else %}
    {% include header.html %}
    <main id="main">{{ content }}</main>
    {% include footer.html %}
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>
